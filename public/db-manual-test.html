<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>db.js manual test checklist</title>
  <style>
    body { font-family: monospace; padding: 1rem; }
    .pass { color: #1a7f37; }
    .fail { color: #cf222e; font-weight: bold; }
    #summary { font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>db.js manual test checklist</h1>
  <p>Not graded. Open DevTools console for the same output. Re-opening this page re-runs
     everything against a dedicated "manualtestdb" store, so results are repeatable.</p>
  <div id="output"></div>
  <div id="summary"></div>

  <script src="db.js"></script>
  <script>
    var outputEl = document.getElementById('output');
    var passCount = 0;
    var failCount = 0;

    function assert(label, condition, details) {
      var line = (condition ? 'PASS' : 'FAIL') + ' - ' + label;
      if (details !== undefined) {
        line += ' (' + details + ')';
      }
      console.log(line);

      var p = document.createElement('div');
      p.className = condition ? 'pass' : 'fail';
      p.textContent = line;
      outputEl.appendChild(p);

      if (condition) {
        passCount++;
      } else {
        failCount++;
      }
    }

    function expectThrows(label, fn) {
      try {
        fn();
        assert(label, false, 'expected an Error to be thrown, but none was');
      } catch (e) {
        assert(label, true, e.message);
      }
    }

    // Directly seeds a cost record with a caller-chosen date, bypassing
    // addCost's "always now" rule, so month/year filtering can be tested
    // against historical dates. Relies on the storage schema documented in
    // planning/db-architecture.md §3.
    function seedCost(dbName, sum, currency, category, description, isoDate) {
      var metaKey = dbName + '.meta';
      var costsKey = dbName + '.costs';
      var meta = JSON.parse(localStorage.getItem(metaKey));
      var costs = JSON.parse(localStorage.getItem(costsKey)) || [];
      var nextId = (meta.lastId || 0) + 1;
      costs.push({
        id: nextId,
        sum: sum,
        currency: currency,
        category: category,
        description: description,
        date: isoDate
      });
      meta.lastId = nextId;
      localStorage.setItem(costsKey, JSON.stringify(costs));
      localStorage.setItem(metaKey, JSON.stringify(meta));
    }

    async function runChecklist() {
      var DB_NAME = 'manualtestdb';

      // reset settings/rates cache so re-runs behave the same way every time
      localStorage.removeItem('costmanager.settings');
      localStorage.removeItem('costmanager.ratesCache');

      var handle = db.openCostsDB(DB_NAME, 1);
      handle.clearAll();

      // --- addCost validation errors ---
      expectThrows('addCost rejects a negative sum', function () {
        handle.addCost({ sum: -5, currency: 'USD', category: 'Food', description: 'x' });
      });
      expectThrows('addCost rejects a zero sum', function () {
        handle.addCost({ sum: 0, currency: 'USD', category: 'Food', description: 'x' });
      });
      expectThrows('addCost rejects a non-numeric sum', function () {
        handle.addCost({ sum: 'abc', currency: 'USD', category: 'Food', description: 'x' });
      });
      expectThrows('addCost rejects an unsupported currency code (EUR, not EURO)', function () {
        handle.addCost({ sum: 5, currency: 'EUR', category: 'Food', description: 'x' });
      });
      expectThrows('addCost rejects a blank category', function () {
        handle.addCost({ sum: 5, currency: 'USD', category: '   ', description: 'x' });
      });
      expectThrows('addCost rejects a missing category', function () {
        handle.addCost({ sum: 5, currency: 'USD', description: 'x' });
      });
      expectThrows('addCost rejects a blank description', function () {
        handle.addCost({ sum: 5, currency: 'USD', category: 'Food', description: '   ' });
      });
      expectThrows('addCost rejects a missing cost object', function () {
        handle.addCost(undefined);
      });

      // --- multi-currency totals (this month, via the real addCost path) ---
      handle.addCost({ sum: 100, currency: 'USD', category: 'Food', description: 'usd item' });
      handle.addCost({ sum: 340, currency: 'ILS', category: 'Food', description: 'ils item' }); // = 100 USD at fallback rates
      var thisMonthReport = db.getReport('USD');
      assert(
        'getReport converts mixed-currency totals correctly (expect 200 USD)',
        thisMonthReport.total.sum === 200,
        'got ' + thisMonthReport.total.sum
      );
      assert(
        'getReport rows keep their original currency/sum',
        thisMonthReport.costs.every(function (c) { return c.currency === 'USD' || c.currency === 'ILS'; }) &&
          thisMonthReport.costs.some(function (c) { return c.currency === 'ILS' && c.sum === 340; })
      );

      // --- month/year filtering, including an empty month ---
      var emptyMonthReport = db.getReport('USD', 2000, 1);
      assert(
        'getReport on a month with no data returns an empty costs array and total 0',
        emptyMonthReport.costs.length === 0 && emptyMonthReport.total.sum === 0,
        JSON.stringify(emptyMonthReport)
      );

      seedCost(DB_NAME, 50, 'USD', 'Travel', 'seeded past month', '2023-05-15T10:00:00.000Z');
      var pastMonthReport = db.getReport('USD', 2023, 5);
      assert(
        'getReport filters to the requested past year/month',
        pastMonthReport.costs.length === 1 && pastMonthReport.total.sum === 50,
        JSON.stringify(pastMonthReport)
      );
      assert(
        'getReport for the current month is unaffected by the seeded past item',
        db.getReport('USD').total.sum === 200
      );

      // --- year-boundary item ---
      // Noon UTC, not near-midnight UTC: getReport filters by LOCAL date (by
      // design - see planning/db-architecture.md §3), so a timestamp close
      // to midnight UTC can land on a different local day depending on the
      // browser's timezone. Noon UTC stays on the same local calendar day
      // for every real-world timezone offset.
      seedCost(DB_NAME, 10, 'USD', 'Food', 'dec 31', '2023-12-31T12:00:00.000Z');
      seedCost(DB_NAME, 20, 'USD', 'Food', 'jan 1', '2024-01-01T12:00:00.000Z');
      var dec2023 = db.getReport('USD', 2023, 12);
      var jan2024 = db.getReport('USD', 2024, 1);
      assert(
        'a Dec 31 item is reported under December of its own year, not January of the next',
        dec2023.costs.length === 1 && dec2023.total.sum === 10,
        JSON.stringify(dec2023)
      );
      assert(
        'a Jan 1 item is reported under January of its own year, not December of the previous',
        jan2024.costs.length === 1 && jan2024.total.sum === 20,
        JSON.stringify(jan2024)
      );

      // --- getCategoryTotals shape ---
      seedCost(DB_NAME, 30, 'USD', 'Education', 'course', '2023-05-10T10:00:00.000Z');
      var categoryTotals = db.getCategoryTotals('USD', 2023, 5);
      assert(
        'getCategoryTotals aggregates by category and sorts descending',
        categoryTotals.length === 2 &&
          categoryTotals[0].category === 'Travel' && categoryTotals[0].total === 50 &&
          categoryTotals[1].category === 'Education' && categoryTotals[1].total === 30,
        JSON.stringify(categoryTotals)
      );
      assert(
        'getCategoryTotals returns an empty array for a month with no data',
        db.getCategoryTotals('USD', 2000, 1).length === 0
      );

      // --- getYearlyTotals shape ---
      var yearlyTotals = db.getYearlyTotals('USD', 2023);
      assert(
        'getYearlyTotals always returns 12 entries, months 1-12 in order',
        yearlyTotals.length === 12 && yearlyTotals[0].month === 1 && yearlyTotals[11].month === 12
      );
      assert(
        'getYearlyTotals reports 0 for months with no data',
        yearlyTotals[0].total === 0
      );
      assert(
        'getYearlyTotals reports the seeded May and December 2023 totals',
        yearlyTotals[4].total === 80 && yearlyTotals[11].total === 10,
        JSON.stringify(yearlyTotals)
      );

      // --- setRatesUrl with a broken URL -> getExchangeRates never rejects ---
      var brokenUrl = 'https://this-domain-should-not-resolve.cost-manager-test.invalid/rates.json';
      var setUrlOk = true;
      try {
        db.setRatesUrl(brokenUrl);
      } catch (e) {
        setUrlOk = false;
      }
      assert('setRatesUrl accepts a well-formed http(s) URL', setUrlOk);
      assert('getRatesUrl reflects the newly set URL', db.getRatesUrl() === brokenUrl);

      expectThrows('setRatesUrl rejects a non-http(s) URL', function () {
        db.setRatesUrl('ftp://example.com/rates.json');
      });

      var ratesResult = await db.getExchangeRates({ force: true });
      assert(
        'getExchangeRates resolves (never rejects) even when the URL is unreachable',
        true
      );
      assert(
        'a failed fetch with no prior cache reports source "fallback"',
        ratesResult.source === 'fallback',
        'got source=' + ratesResult.source
      );
      assert(
        'a failed fetch populates a readable error message',
        typeof ratesResult.error === 'string' && ratesResult.error.length > 0,
        ratesResult.error
      );
      assert(
        'a failed fetch still returns a usable rates object',
        ratesResult.rates && ratesResult.rates.USD === 1
      );

      db.setRatesUrl(''); // reset to the default URL for the rest of the checklist

      // --- getReport with the rates cache cleared stays synchronous and correct ---
      db.setRatesUrl(brokenUrl); // setRatesUrl always clears the cache as a side effect
      var reportAfterClearedCache = db.getReport('USD', 2023, 5);
      assert(
        'getReport still returns synchronously with the cache cleared (falls back to FALLBACK_RATES)',
        reportAfterClearedCache.total.sum === 80,
        JSON.stringify(reportAfterClearedCache)
      );
      db.setRatesUrl(''); // leave the store on the default URL

      var summaryEl = document.getElementById('summary');
      summaryEl.textContent = passCount + ' passed, ' + failCount + ' failed';
      summaryEl.className = failCount === 0 ? 'pass' : 'fail';
      console.log(passCount + ' passed, ' + failCount + ' failed');
    }

    runChecklist();
  </script>
</body>
</html>
